[project]
name = "mousemap"
version = "0.3.0"
description = "Remapeia os botões extras do mouse no Linux (Wayland e X11), com interface GTK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["evdev>=1.6", "PyGObject>=3.48"]

[project.scripts]
mousemapd = "mousemap.daemon.main:main"

[project.gui-scripts]
mousemap = "mousemap.gui.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
